<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Manage Blogs | NEPSOP Admin</title>
  <meta name="robots" content="noindex, nofollow">

  <!-- Favicons -->
  <link href="../assets/favicon/apple-icon.png" rel="icon">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="../assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">

  <!-- Admin CSS -->
  <link href="../assets/css/admin.css" rel="stylesheet">
</head>
<body class="admin-body">

  <!-- Admin Navbar -->
  <nav class="admin-navbar">
    <a href="/admin/index.html" class="admin-brand">
      <i class="bi bi-grid-1x2-fill"></i>
      NEPSOP Admin
      <span>/ Blogs</span>
    </a>
    <div class="admin-navbar-right">
      <span class="admin-email" id="adminEmail"></span>
      <button class="admin-logout-btn" id="logoutBtn">
        <i class="bi bi-box-arrow-right"></i> Logout
      </button>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="admin-container">

    <!-- Page Header -->
    <div class="admin-page-header">
      <div>
        <h1><i class="bi bi-journal-richtext"></i> Blog Posts</h1>
        <p class="admin-page-subtitle">Create, edit and manage all blog content.</p>
      </div>
      <a href="/admin/blog-create.html" class="admin-btn admin-btn-primary">
        <i class="bi bi-plus-lg"></i> Create New Blog
      </a>
    </div>

    <!-- Blog Table Card -->
    <div class="admin-card">
      <div id="blogsLoading" class="admin-loading">
        <div class="admin-spinner"></div>
      </div>

      <div id="blogsEmpty" class="admin-empty" style="display: none;">
        <i class="bi bi-journal-plus"></i>
        <p>No blog posts yet</p>
        <small>Create your first blog post to start publishing content.</small>
        <a href="/admin/blog-create.html" class="admin-btn admin-btn-primary" style="margin-top: 8px;">
          <i class="bi bi-plus-lg"></i> Create New Blog
        </a>
      </div>

      <div id="blogsTable" class="admin-table-wrap" style="display: none;">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Blog Post</th>
              <th>Status</th>
              <th>Last Updated</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="blogsBody">
          </tbody>
        </table>
      </div>

      <!-- Mobile Blog Cards -->
      <div class="admin-blog-list" id="blogsMobile" style="display: none;">
      </div>

      <div id="blogsError" class="admin-empty" style="display: none;">
        <i class="bi bi-exclamation-triangle"></i>
        <p>Unable to load blog posts.</p>
        <small>Please try refreshing the page.</small>
        <button class="admin-btn admin-btn-outline" onclick="location.reload()">
          <i class="bi bi-arrow-clockwise"></i> Retry
        </button>
      </div>
    </div>

  </div>

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <!-- Config -->
  <script src="../assets/js/config.js"></script>

  <!-- Supabase Client -->
  <script src="../assets/js/supabase.js"></script>

  <!-- Auth Module -->
  <script src="../assets/js/auth.js"></script>

  <!-- Blogs Module -->
  <script src="../assets/js/blogs.js"></script>

  <script>
    (async function() {
      // Protect this page
      const session = await NEPSOP.auth.requireAuth();
      if (!session) return;

      // Show admin email
      document.getElementById('adminEmail').textContent = session.user.email;

      // Logout
      document.getElementById('logoutBtn').addEventListener('click', async function() {
        await NEPSOP.auth.logout();
      });

      const blogsLoading = document.getElementById('blogsLoading');
      const blogsEmpty = document.getElementById('blogsEmpty');
      const blogsTable = document.getElementById('blogsTable');
      const blogsMobile = document.getElementById('blogsMobile');
      const blogsBody = document.getElementById('blogsBody');
      const blogsError = document.getElementById('blogsError');

      await loadBlogs();

      async function loadBlogs() {
        blogsLoading.style.display = 'flex';
        blogsEmpty.style.display = 'none';
        blogsTable.style.display = 'none';
        blogsMobile.style.display = 'none';
        blogsError.style.display = 'none';

        try {
          const blogs = await NEPSOP.blogs.getAllBlogs();

          blogsLoading.style.display = 'none';

          if (blogs.length === 0) {
            blogsEmpty.style.display = 'block';
            return;
          }

          // Desktop table
          blogsBody.innerHTML = blogs.map(function(blog) {
            var statusClass = blog.status === 'published' ? 'admin-badge-published' : 'admin-badge-draft';
            var statusLabel = blog.status === 'published' ? 'Published' : 'Draft';
            var statusIcon = blog.status === 'published' ? 'check-circle-fill' : 'pencil-square';

            var thumbHtml = blog.featured_image
              ? '<img class="blog-thumb" src="' + NEPSOP.blogs.escapeHtml(blog.featured_image) + '" alt="" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">'
              : '';
            var placeholderHtml = '<div class="blog-thumb-placeholder" style="' + (blog.featured_image ? 'display:none' : '') + '"><i class="bi bi-journal-text"></i></div>';

            return '<tr data-blog-id="' + blog.id + '">' +
              '<td class="blog-title-cell">' +
                '<div style="display:flex;align-items:center;gap:12px;">' +
                  thumbHtml + placeholderHtml +
                  '<div>' +
                    '<a href="/admin/blog-edit.html?id=' + blog.id + '">' + NEPSOP.blogs.escapeHtml(blog.title) + '</a>' +
                    '<span class="blog-meta">' + NEPSOP.blogs.formatDate(blog.updated_at || blog.created_at) + '</span>' +
                  '</div>' +
                '</div>' +
              '</td>' +
              '<td><span class="admin-badge ' + statusClass + '"><i class="bi bi-' + statusIcon + '"></i> ' + statusLabel + '</span></td>' +
              '<td>' + NEPSOP.blogs.formatDate(blog.updated_at || blog.created_at) + '</td>' +
              '<td>' +
                '<div class="admin-actions">' +
                  '<a href="/admin/blog-edit.html?id=' + blog.id + '" class="admin-btn admin-btn-ghost" title="Edit">' +
                    '<i class="bi bi-pencil"></i> Edit' +
                  '</a>' +
                  '<button class="admin-btn admin-btn-ghost text-danger delete-blog-btn" data-id="' + blog.id + '" data-title="' + NEPSOP.blogs.escapeHtml(blog.title) + '" title="Delete">' +
                    '<i class="bi bi-trash3"></i> Delete' +
                  '</button>' +
                '</div>' +
              '</td>' +
            '</tr>';
          }).join('');

          // Mobile cards
          blogsMobile.innerHTML = blogs.map(function(blog) {
            var statusClass = blog.status === 'published' ? 'admin-badge-published' : 'admin-badge-draft';
            var statusLabel = blog.status === 'published' ? 'Published' : 'Draft';
            var statusIcon = blog.status === 'published' ? 'check-circle-fill' : 'pencil-square';

            var thumbHtml = blog.featured_image
              ? '<img class="admin-blog-card-thumb" src="' + NEPSOP.blogs.escapeHtml(blog.featured_image) + '" alt="" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">'
              : '';
            var placeholderHtml = '<div class="admin-blog-card-thumb-placeholder" style="' + (blog.featured_image ? 'display:none' : '') + '"><i class="bi bi-journal-text"></i></div>';

            return '<div class="admin-blog-card" data-blog-id="' + blog.id + '">' +
              thumbHtml + placeholderHtml +
              '<div class="admin-blog-card-content">' +
                '<div class="admin-blog-card-title"><a href="/admin/blog-edit.html?id=' + blog.id + '">' + NEPSOP.blogs.escapeHtml(blog.title) + '</a></div>' +
                '<div class="admin-blog-card-meta">' +
                  '<span class="admin-badge ' + statusClass + '"><i class="bi bi-' + statusIcon + '"></i> ' + statusLabel + '</span>' +
                  '<span>' + NEPSOP.blogs.formatDate(blog.updated_at || blog.created_at) + '</span>' +
                '</div>' +
                '<div class="admin-blog-card-actions">' +
                  '<a href="/admin/blog-edit.html?id=' + blog.id + '" class="admin-btn admin-btn-outline admin-btn-sm">' +
                    '<i class="bi bi-pencil"></i> Edit' +
                  '</a>' +
                  '<button class="admin-btn admin-btn-outline admin-btn-sm delete-blog-btn" data-id="' + blog.id + '" data-title="' + NEPSOP.blogs.escapeHtml(blog.title) + '" style="color:var(--admin-danger);border-color:var(--admin-danger-border);">' +
                    '<i class="bi bi-trash3"></i> Delete' +
                  '</button>' +
                '</div>' +
              '</div>' +
            '</div>';
          }).join('');

          blogsTable.style.display = 'block';
          blogsMobile.style.display = 'flex';

          // Bind delete buttons (both desktop and mobile)
          document.querySelectorAll('.delete-blog-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
              var id = this.dataset.id;
              var title = this.dataset.title;
              showConfirmDialog(
                'Delete Blog Post',
                'Are you sure you want to delete "' + title + '"? This action cannot be undone.',
                async function() {
                  try {
                    await NEPSOP.blogs.deleteBlog(id);
                    showToast('Blog deleted successfully.', 'success');
                    await loadBlogs();
                  } catch (err) {
                    showToast('Unable to delete blog. Please try again.', 'error');
                  }
                }
              );
            });
          });

        } catch (err) {
          blogsLoading.style.display = 'none';
          blogsError.style.display = 'block';
        }
      }

      // ── Confirmation Dialog ──
      function showConfirmDialog(title, message, onConfirm) {
        var existing = document.querySelector('.admin-dialog-overlay');
        if (existing) existing.remove();

        var overlay = document.createElement('div');
        overlay.className = 'admin-dialog-overlay';
        overlay.innerHTML =
          '<div class="admin-dialog">' +
            '<h3>' + title + '</h3>' +
            '<p>' + message + '</p>' +
            '<div class="admin-dialog-actions">' +
              '<button class="admin-btn admin-btn-outline admin-dialog-cancel">Cancel</button>' +
              '<button class="admin-btn admin-btn-danger admin-dialog-confirm">Delete</button>' +
            '</div>' +
          '</div>';

        document.body.appendChild(overlay);

        overlay.querySelector('.admin-dialog-cancel').addEventListener('click', function() {
          overlay.remove();
        });

        overlay.querySelector('.admin-dialog-confirm').addEventListener('click', async function() {
          this.disabled = true;
          this.textContent = 'Deleting...';
          await onConfirm();
          overlay.remove();
        });

        overlay.addEventListener('click', function(e) {
          if (e.target === overlay) overlay.remove();
        });
      }

      // ── Toast ──
      function showToast(message, type) {
        var existing = document.querySelector('.admin-toast');
        if (existing) existing.remove();

        var icon = type === 'success' ? 'check-circle-fill' : 'exclamation-circle-fill';
        var toast = document.createElement('div');
        toast.className = 'admin-toast admin-toast-' + type;
        toast.innerHTML = '<i class="bi bi-' + icon + '"></i> ' + message;
        document.body.appendChild(toast);

        setTimeout(function() {
          toast.remove();
        }, 3500);
      }
    })();
  </script>

</body>
</html>
