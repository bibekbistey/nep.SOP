<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Manage Blogs | NEPSOP Admin</title>
  <meta name="robots" content="noindex, nofollow">

  <!-- Favicons -->
  <link href="../assets/favicon/apple-icon.png" rel="icon">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="../assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">

  <!-- Admin CSS -->
  <link href="../assets/css/admin.css" rel="stylesheet">
</head>
<body class="admin-body">

  <!-- Admin Navbar -->
  <nav class="admin-navbar">
    <a href="/admin/index.html" class="admin-brand">
      <i class="bi bi-speedometer2"></i>
      NEPSOP Admin
      <span>/ Blogs</span>
    </a>
    <div class="admin-navbar-right">
      <span class="admin-email" id="adminEmail"></span>
      <button class="admin-logout-btn" id="logoutBtn">
        <i class="bi bi-box-arrow-right"></i> Logout
      </button>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="admin-container">

    <!-- Page Header -->
    <div class="admin-page-header">
      <h1><i class="bi bi-journal-text"></i> Blog Posts</h1>
      <a href="/admin/blog-create.html" class="admin-btn admin-btn-primary">
        <i class="bi bi-plus-circle"></i> Create New Blog
      </a>
    </div>

    <!-- Blog Table Card -->
    <div class="admin-card">
      <div id="blogsLoading" class="admin-loading">
        <div class="admin-spinner"></div>
      </div>

      <div id="blogsEmpty" class="admin-empty" style="display: none;">
        <i class="bi bi-journal-plus"></i>
        <p>No blog posts yet.</p>
        <a href="/admin/blog-create.html" class="admin-btn admin-btn-primary" style="margin-top: 12px;">
          <i class="bi bi-plus-circle"></i> Create Your First Blog
        </a>
      </div>

      <div id="blogsTable" class="admin-table-wrap" style="display: none;">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Title</th>
              <th>Status</th>
              <th>Author</th>
              <th>Published</th>
              <th>Created</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="blogsBody">
          </tbody>
        </table>
      </div>

      <div id="blogsError" class="admin-empty" style="display: none;">
        <i class="bi bi-exclamation-triangle"></i>
        <p>Unable to load blog posts. Please try refreshing the page.</p>
        <button class="admin-btn admin-btn-outline" onclick="location.reload()">
          <i class="bi bi-arrow-clockwise"></i> Retry
        </button>
      </div>
    </div>

  </div>

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <!-- Config -->
  <script src="../assets/js/config.js"></script>

  <!-- Supabase Client -->
  <script src="../assets/js/supabase.js"></script>

  <!-- Auth Module -->
  <script src="../assets/js/auth.js"></script>

  <!-- Blogs Module -->
  <script src="../assets/js/blogs.js"></script>

  <script>
    (async function() {
      // Protect this page
      const session = await NEPSOP.auth.requireAuth();
      if (!session) return;

      // Show admin email
      document.getElementById('adminEmail').textContent = session.user.email;

      // Logout
      document.getElementById('logoutBtn').addEventListener('click', async function() {
        await NEPSOP.auth.logout();
      });

      const blogsLoading = document.getElementById('blogsLoading');
      const blogsEmpty = document.getElementById('blogsEmpty');
      const blogsTable = document.getElementById('blogsTable');
      const blogsBody = document.getElementById('blogsBody');
      const blogsError = document.getElementById('blogsError');

      await loadBlogs();

      async function loadBlogs() {
        blogsLoading.style.display = 'flex';
        blogsEmpty.style.display = 'none';
        blogsTable.style.display = 'none';
        blogsError.style.display = 'none';

        try {
          const blogs = await NEPSOP.blogs.getAllBlogs();

          blogsLoading.style.display = 'none';

          if (blogs.length === 0) {
            blogsEmpty.style.display = 'block';
            return;
          }

          blogsBody.innerHTML = blogs.map(function(blog) {
            const statusClass = blog.status === 'published' ? 'admin-badge-published' : 'admin-badge-draft';
            const statusLabel = blog.status === 'published' ? 'Published' : 'Draft';
            const publishToggleLabel = blog.status === 'published' ? 'Unpublish' : 'Publish';

            return '<tr data-blog-id="' + blog.id + '">' +
              '<td class="blog-title-cell"><a href="/admin/blog-edit.html?id=' + blog.id + '">' + NEPSOP.blogs.escapeHtml(blog.title) + '</a></td>' +
              '<td><span class="admin-badge ' + statusClass + '">' + statusLabel + '</span></td>' +
              '<td>' + NEPSOP.blogs.escapeHtml(blog.author || '—') + '</td>' +
              '<td>' + NEPSOP.blogs.formatDate(blog.published_at) + '</td>' +
              '<td>' + NEPSOP.blogs.formatDate(blog.created_at) + '</td>' +
              '<td>' +
                '<div class="admin-actions">' +
                  '<a href="/admin/blog-edit.html?id=' + blog.id + '" class="admin-btn admin-btn-outline admin-btn-sm" title="Edit">' +
                    '<i class="bi bi-pencil"></i> Edit' +
                  '</a>' +
                  '<button class="admin-btn admin-btn-outline admin-btn-sm toggle-status-btn" data-id="' + blog.id + '" data-status="' + blog.status + '" title="' + publishToggleLabel + '">' +
                    '<i class="bi bi-' + (blog.status === 'published' ? 'pause-circle' : 'play-circle') + '"></i> ' + publishToggleLabel +
                  '</button>' +
                  '<button class="admin-btn admin-btn-danger admin-btn-sm delete-blog-btn" data-id="' + blog.id + '" data-title="' + NEPSOP.blogs.escapeHtml(blog.title) + '" title="Delete">' +
                    '<i class="bi bi-trash"></i> Delete' +
                  '</button>' +
                '</div>' +
              '</td>' +
            '</tr>';
          }).join('');

          blogsTable.style.display = 'block';

          // Bind toggle status buttons
          blogsBody.querySelectorAll('.toggle-status-btn').forEach(function(btn) {
            btn.addEventListener('click', async function() {
              const id = this.dataset.id;
              const currentStatus = this.dataset.status;
              const newStatus = currentStatus === 'published' ? 'draft' : 'published';

              this.disabled = true;
              try {
                const blog = await NEPSOP.blogs.getBlogById(id);
                await NEPSOP.blogs.updateBlog(id, {
                  ...blog,
                  status: newStatus,
                });
                showToast('Blog status updated to ' + newStatus + '.', 'success');
                await loadBlogs();
              } catch (err) {
                showToast('Unable to update status. Please try again.', 'error');
                this.disabled = false;
              }
            });
          });

          // Bind delete buttons
          blogsBody.querySelectorAll('.delete-blog-btn').forEach(function(btn) {
            btn.addEventListener('click', async function() {
              const id = this.dataset.id;
              const title = this.dataset.title;

              if (!confirm('Are you sure you want to delete "' + title + '"?')) return;

              this.disabled = true;
              try {
                await NEPSOP.blogs.deleteBlog(id);
                showToast('Blog deleted successfully.', 'success');
                await loadBlogs();
              } catch (err) {
                showToast('Unable to delete blog. Please try again.', 'error');
                this.disabled = false;
              }
            });
          });

        } catch (err) {
          blogsLoading.style.display = 'none';
          blogsError.style.display = 'block';
        }
      }

      function showToast(message, type) {
        const existing = document.querySelector('.admin-toast');
        if (existing) existing.remove();

        const toast = document.createElement('div');
        toast.className = 'admin-toast admin-toast-' + type;
        toast.textContent = message;
        document.body.appendChild(toast);

        setTimeout(function() {
          toast.remove();
        }, 3000);
      }
    })();
  </script>

</body>
</html>
