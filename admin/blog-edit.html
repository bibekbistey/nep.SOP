<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Edit Blog | NEPSOP Admin</title>
  <meta name="robots" content="noindex, nofollow">

  <!-- Favicons -->
  <link href="../assets/favicon/apple-icon.png" rel="icon">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="../assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">

  <!-- Admin CSS -->
  <link href="../assets/css/admin.css" rel="stylesheet">
</head>
<body class="admin-body">

  <!-- Admin Navbar -->
  <nav class="admin-navbar">
    <a href="/admin/index.html" class="admin-brand">
      <i class="bi bi-speedometer2"></i>
      NEPSOP Admin
      <span>/ Edit Blog</span>
    </a>
    <div class="admin-navbar-right">
      <span class="admin-email" id="adminEmail"></span>
      <button class="admin-logout-btn" id="logoutBtn">
        <i class="bi bi-box-arrow-right"></i> Logout
      </button>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="admin-container">

    <!-- Page Header -->
    <div class="admin-page-header">
      <h1><i class="bi bi-pencil"></i> Edit Blog</h1>
      <a href="/admin/blogs.html" class="admin-btn admin-btn-outline">
        <i class="bi bi-arrow-left"></i> Back to Blogs
      </a>
    </div>

    <!-- Loading -->
    <div id="editLoading" class="admin-loading">
      <div class="admin-spinner"></div>
    </div>

    <!-- Not Found -->
    <div id="editNotFound" class="admin-empty" style="display: none;">
      <i class="bi bi-journal-x"></i>
      <p>Blog post not found.</p>
      <a href="/admin/blogs.html" class="admin-btn admin-btn-primary" style="margin-top: 12px;">
        <i class="bi bi-arrow-left"></i> Back to Blogs
      </a>
    </div>

    <!-- Blog Form -->
    <div id="editForm" class="admin-card" style="display: none;">
      <form id="blogForm">
        <input type="hidden" id="blogId">

        <div class="admin-form-group">
          <label class="admin-form-label" for="title">Title *</label>
          <input class="admin-form-input" type="text" id="title" name="title" required placeholder="Blog title">
        </div>

        <div class="admin-form-group">
          <label class="admin-form-label" for="slug">Slug</label>
          <input class="admin-form-input" type="text" id="slug" name="slug" placeholder="blog-slug">
          <p class="admin-form-hint">URL-friendly version of the title.</p>
        </div>

        <div class="admin-form-group">
          <label class="admin-form-label" for="excerpt">Excerpt</label>
          <textarea class="admin-form-input" id="excerpt" name="excerpt" rows="3" placeholder="A brief summary of the blog post..." style="min-height: 80px; resize: vertical;"></textarea>
        </div>

        <div class="admin-form-group">
          <label class="admin-form-label" for="featuredImage">Featured Image URL</label>
          <input class="admin-form-input" type="url" id="featuredImage" name="featured_image" placeholder="https://example.com/image.jpg">
          <p class="admin-form-hint">Paste a direct URL to the image.</p>
        </div>

        <div class="admin-form-group">
          <label class="admin-form-label" for="author">Author</label>
          <input class="admin-form-input" type="text" id="author" name="author" placeholder="NEPSOP Team">
        </div>

        <div class="admin-form-group">
          <label class="admin-form-label" for="content">Content *</label>
          <p class="admin-form-hint" style="margin-bottom: 8px;">HTML is supported. You can use headings, paragraphs, lists, images, and links.</p>
          <textarea class="admin-form-textarea" id="content" name="content" placeholder="Write your blog content here. HTML is supported." style="min-height: 320px;"></textarea>
        </div>

        <div class="admin-form-group">
          <label class="admin-form-label" for="status">Status</label>
          <select class="admin-form-input admin-form-select" id="status" name="status">
            <option value="draft">Draft</option>
            <option value="published">Published</option>
          </select>
        </div>

        <div style="display: flex; gap: 12px; margin-top: 24px; flex-wrap: wrap;">
          <button type="submit" class="admin-btn admin-btn-primary" id="submitBtn">
            <i class="bi bi-check-lg"></i> <span id="submitBtnText">Update Blog</span>
          </button>
          <a href="/admin/blogs.html" class="admin-btn admin-btn-outline">Cancel</a>
        </div>
      </form>
    </div>

  </div>

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <!-- Config -->
  <script src="../assets/js/config.js"></script>

  <!-- Supabase Client -->
  <script src="../assets/js/supabase.js"></script>

  <!-- Auth Module -->
  <script src="../assets/js/auth.js"></script>

  <!-- Blogs Module -->
  <script src="../assets/js/blogs.js"></script>

  <script>
    (async function() {
      // Protect this page
      const session = await NEPSOP.auth.requireAuth();
      if (!session) return;

      // Show admin email
      document.getElementById('adminEmail').textContent = session.user.email;

      // Logout
      document.getElementById('logoutBtn').addEventListener('click', async function() {
        await NEPSOP.auth.logout();
      });

      const params = new URLSearchParams(window.location.search);
      const blogId = params.get('id');

      if (!blogId) {
        document.getElementById('editLoading').style.display = 'none';
        document.getElementById('editNotFound').style.display = 'block';
        return;
      }

      const editLoading = document.getElementById('editLoading');
      const editNotFound = document.getElementById('editNotFound');
      const editForm = document.getElementById('editForm');
      const form = document.getElementById('blogForm');
      const submitBtn = document.getElementById('submitBtn');
      const submitBtnText = document.getElementById('submitBtnText');

      let originalBlog = null;

      // Load blog data
      try {
        originalBlog = await NEPSOP.blogs.getBlogById(blogId);

        document.getElementById('blogId').value = originalBlog.id;
        document.getElementById('title').value = originalBlog.title || '';
        document.getElementById('slug').value = originalBlog.slug || '';
        document.getElementById('excerpt').value = originalBlog.excerpt || '';
        document.getElementById('featuredImage').value = originalBlog.featured_image || '';
        document.getElementById('author').value = originalBlog.author || '';
        document.getElementById('content').value = originalBlog.content || '';
        document.getElementById('status').value = originalBlog.status || 'draft';

        editLoading.style.display = 'none';
        editForm.style.display = 'block';
      } catch (err) {
        editLoading.style.display = 'none';
        editNotFound.style.display = 'block';
        return;
      }

      // Handle form submission
      form.addEventListener('submit', async function(e) {
        e.preventDefault();

        const title = document.getElementById('title').value.trim();
        const slug = document.getElementById('slug').value.trim();
        const status = document.getElementById('status').value;

        if (!title) {
          showToast('Please enter a blog title.', 'error');
          return;
        }

        submitBtn.disabled = true;
        submitBtnText.textContent = 'Updating...';

        try {
          await NEPSOP.blogs.updateBlog(blogId, {
            title: title,
            slug: slug || NEPSOP.blogs.generateSlug(title),
            excerpt: document.getElementById('excerpt').value.trim(),
            featured_image: document.getElementById('featuredImage').value.trim(),
            author: document.getElementById('author').value.trim(),
            content: document.getElementById('content').value,
            status: status,
            published_at: originalBlog.published_at,
          });

          showToast('Blog updated successfully!', 'success');

          // Update original reference
          originalBlog.status = status;
        } catch (err) {
          console.error('[NEPSOP] Update blog error:', err);
          showToast('Unable to save changes. Please try again.', 'error');
        }

        submitBtn.disabled = false;
        submitBtnText.textContent = 'Update Blog';
      });

      function showToast(message, type) {
        const existing = document.querySelector('.admin-toast');
        if (existing) existing.remove();

        const toast = document.createElement('div');
        toast.className = 'admin-toast admin-toast-' + type;
        toast.textContent = message;
        document.body.appendChild(toast);

        setTimeout(function() {
          toast.remove();
        }, 3000);
      }
    })();
  </script>

</body>
</html>
